name: Bundle original AYLA character models
on:
  push:
    paths:
      - '.github/workflows/bundle-original-characters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-original-avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original rigged characters
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, struct, time, urllib.request
          rev='2fd9ec82fbe1613d40ae38aadcca3f410725f740'
          models=['priya_casual.glb','leo_smart.glb','emma_casual.glb','ryan_smart.glb']
          urls=[
            'https://raw.githubusercontent.com/memoriesrohit/avatar-studio/'+rev+'/models/',
            'https://cdn.jsdelivr.net/gh/memoriesrohit/avatar-studio@'+rev+'/models/'
          ]
          target=pathlib.Path('assets/characters')
          target.mkdir(parents=True,exist_ok=True)
          total=0
          for name in models:
            dst=target/name
            ok=False
            for attempt in range(4):
              source=urls[attempt%len(urls)]+name
              try:
                print('Downloading',name,'from',source,flush=True)
                req=urllib.request.Request(source,headers={'User-Agent':'AYLA-original-avatar-bundler/1.0'})
                with urllib.request.urlopen(req,timeout=90) as resp:
                  data=resp.read()
                if len(data)<1_000_000:raise ValueError('Unexpectedly small model')
                magic,version,length=struct.unpack_from('<4sII',data,0)
                if magic!=b'glTF' or version!=2 or length!=len(data):
                  raise ValueError('Invalid GLB header or length')
                n,kind=struct.unpack_from('<II',data,12)
                if kind!=0x4E4F534A:raise ValueError('GLB JSON chunk missing')
                document=json.loads(data[20:20+n])
                names={a.get('name') for a in document.get('animations',[])}
                if not {'Idle','Walk','Talk'}.issubset(names):
                  raise ValueError('Original native motions missing: '+str(names))
                if not document.get('skins') or len(document.get('meshes',[]))<2:
                  raise ValueError('Character geometry or skeleton missing')
                dst.write_bytes(data)
                total+=len(data)
                print('VERIFIED',name,len(data),'bytes',len(names),'animations',flush=True)
                ok=True
                break
              except Exception as e:
                print('ATTEMPT FAILED',name,attempt+1,str(e),flush=True)
                time.sleep(2)
            if not ok:raise RuntimeError('Could not bundle '+name)
          print('ALL ORIGINAL CHARACTERS VERIFIED; total bytes:',total,flush=True)
          PY
      - name: Commit rigged original characters to GitHub repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/priya_casual.glb assets/characters/leo_smart.glb assets/characters/emma_casual.glb assets/characters/ryan_smart.glb
          if git diff --cached --quiet; then
            echo "Original models are already included"
          else
            git commit -m "Bundle original rigged AYLA character models for same-origin loading"
            git push origin HEAD:main
          fi
