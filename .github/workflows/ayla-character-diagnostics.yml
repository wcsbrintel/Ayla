name: AYLA realistic character animation diagnostics
on:
  push:
    paths:
      - '.github/workflows/ayla-character-diagnostics.yml'
      - 'realistic-actors-v7.js'
      - 'index.html'
      - 'tests/animation-browser.html'
      - 'tests/animation-browser-runner.cjs'
jobs:
  inspect-original-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original Rocketbox GLB skeleton and animation channels
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct, urllib.request, collections
          rev='2fd9ec82fbe1613d40ae38aadcca3f410725f740'
          url=f'https://raw.githubusercontent.com/memoriesrohit/avatar-studio/{rev}/models/'
          for file in ['priya_casual.glb','leo_smart.glb','emma_casual.glb','ryan_smart.glb']:
              print('\n***',file,flush=True)
              req=urllib.request.Request(url+file,headers={'User-Agent':'AYLA-character-diagnostics'})
              data=urllib.request.urlopen(req,timeout=90).read()
              magic,version,length=struct.unpack_from('<4sII',data,0)
              assert magic==b'glTF' and version==2
              chunk_length,chunk_kind=struct.unpack_from('<II',data,12)
              assert chunk_kind==0x4e4f534a
              gltf=json.loads(data[20:20+chunk_length])
              nodes=gltf.get('nodes',[])
              print('bytes',len(data),'nodes',len(nodes),'skins',len(gltf.get('skins',[])),'meshes',len(gltf.get('meshes',[])),flush=True)
              for animation in gltf.get('animations',[]):
                  name=animation.get('name','(unnamed)')
                  channels=animation.get('channels',[])
                  paths=collections.Counter(c.get('target',{}).get('path') for c in channels)
                  target_names=[nodes[c['target']['node']].get('name','') for c in channels if 'node' in c.get('target',{})]
                  limbs=[n for n in target_names if any(x in n.lower() for x in ['arm','leg','hand','foot','thigh','calf'])]
                  print('ANIM',name,'CHANNELS',len(channels),'PATHS',dict(paths),'LIMBS',len(limbs),'EXAMPLE',limbs[:5],flush=True)
              print('ANIMATIONS_TOTAL',len(gltf.get('animations',[])),flush=True)
          PY

  test-in-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Install headless browser controller
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Run Babylon character limb movement test
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ayla-http.log 2>&1 &
          sleep 2
          timeout --signal=TERM 95s node tests/animation-browser-runner.cjs

  test-windows-chrome:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Configure Chrome for Windows
        shell: pwsh
        run: |
          "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install browser test dependencies
        shell: pwsh
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify original character appearance and limb animation on Windows
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Sleep -Seconds 3
          node tests/animation-browser-runner.cjs
